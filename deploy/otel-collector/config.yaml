# OpenTelemetry Collector → Búho (OTLP/HTTP JSON)
#
# Apps → this collector (gRPC :4317 / HTTP :4318) → Buho JSON ingest.
#
#   docker compose -f deploy/otel-collector/docker-compose.yml up -d

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 256
    timeout: 1s
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  # Absolute traces URL — Buho path is /api/otlp/v1/traces (not /v1/traces).
  otlphttp/buho:
    traces_endpoint: ${env:BUHO_OTLP_TRACES}
    encoding: json
    compression: none
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/buho, debug]
