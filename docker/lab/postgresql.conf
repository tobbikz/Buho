# Shared PostgreSQL settings tuned to pass Búho health checks on a small lab instance.
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB

idle_in_transaction_session_timeout = 15min
statement_timeout = 15min

track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

max_connections = 100
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
# Keep enough WAL for a lab standby that lags (disk-full, collector restart).
# Without this, checkpoints recycle segments and streaming dies with
# "requested WAL segment has already been removed".
wal_keep_size = 1GB
max_slot_wal_keep_size = 2GB

listen_addresses = '*'
port = 5432