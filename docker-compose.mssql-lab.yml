# Lab SQL Server 2022 for Búho — single instance on buho_default.
# Host: 127.0.0.1:1433 → container 1433 (conflicts with a local SQL Server on Windows).
# SA password: MSSQL_SA_PASSWORD (default Buho_Mssql_Lab1!). Image ~1.5GB; first start ~1–2 min.
services:
  mssql-lab:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: buho-mssql-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Buho_Mssql_Lab1!}
    volumes:
      - buho_mssql_lab_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - default

volumes:
  buho_mssql_lab_data:

networks:
  default:
    name: buho_default
    external: true
