# Lab Elasticsearch + Kibana for Búho — single node on buho_default.
# Host: 127.0.0.1:9200 (ES) · 127.0.0.1:5601 (Kibana)
# Data on /home (not /) — /var/lib/docker lives on small root disk.
# Security disabled; cluster often yellow with default replicas on 1 node.
# Kibana: explore Elastic UI features to port into Búho (ES engine).
services:
  elasticsearch-lab:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: buho-elasticsearch-lab
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.name: buho-lab
      bootstrap.memory_lock: "true"
      # /home is ~92% used but has ~72G free; relax watermarks for lab.
      cluster.routing.allocation.disk.watermark.low: 95%
      cluster.routing.allocation.disk.watermark.high: 97%
      cluster.routing.allocation.disk.watermark.flood_stage: 99%
      cluster.info.update.interval: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - /home/iks/apps/elastic-lab/es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - default

  kibana-lab:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: buho-kibana-lab
    restart: unless-stopped
    depends_on:
      elasticsearch-lab:
        condition: service_healthy
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_NAME: buho-kibana-lab
      ELASTICSEARCH_HOSTS: '["http://elasticsearch-lab:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "buho-lab-kibana-encryption-key-32b"
      TELEMETRY_ENABLED: "false"
      # Give migrations more time on a busy host
      ELASTICSEARCH_REQUESTTIMEOUT: "120000"
      ELASTICSEARCH_SHARDTIMEOUT: "120000"
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - /home/iks/apps/elastic-lab/kibana-data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks:
      - default

networks:
  default:
    name: buho_default
    external: true
