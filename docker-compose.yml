services:
  store:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: buho
      POSTGRES_PASSWORD: ${BUHO_STORE_PASSWORD:-buho}
      POSTGRES_DB: buho
      TZ: ${BUHO_TZ:-UTC}
    ports:
      # 55432 en el host para no chocar con un PostgreSQL local en 5432. Se
      # puede mover si ese puerto ya está tomado.
      - "127.0.0.1:${BUHO_STORE_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 espera el montaje en /var/lib/postgresql, no en
      # /var/lib/postgresql/data: con la ruta antigua el contenedor no arranca.
      - buho_store:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buho -d buho"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  collector:
    # Por omisión se baja de GHCR (install.sh --pull). Si se construye en local
    # (`docker compose build`), la imagen queda etiquetada con el mismo nombre.
    # Lab tip: when config.json has engine=endpoint (probes), prefer host
    # `npm run collector` and keep this service stopped — older GHCR images
    # reject endpoint. Rebuild locally (`docker compose build collector`) before
    # `docker compose up -d collector` if you need the container path.
    image: ${BUHO_COLLECTOR_IMAGE:-ghcr.io/tobbikz/buho-monitor/collector:latest}
    build: .
    depends_on:
      store:
        condition: service_healthy
    environment:
      BUHO_STORE_URL: postgres://buho:${BUHO_STORE_PASSWORD:-buho}@store:5432/buho
      BUHO_CONFIG: /app/config.json
      # Las líneas base agrupan por hora del día: colector, consola y store
      # tienen que estar en la misma zona o la banda sale corrida.
      TZ: ${BUHO_TZ:-UTC}
    volumes:
      - ./config.json:/app/config.json:ro
      # Lab: read /proc inside Maria containers via docker exec (hostMetrics.source=docker)
      - /var/run/docker.sock:/var/run/docker.sock
    # Para monitorear instancias que corren en el host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    image: ${BUHO_WEB_IMAGE:-ghcr.io/tobbikz/buho-monitor/web:latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      store:
        condition: service_healthy
    environment:
      # La UI sólo habla con el store; nunca con las instancias monitoreadas.
      BUHO_STORE_URL: postgres://buho:${BUHO_STORE_PASSWORD:-buho}@store:5432/buho
      # Sin uno de estos dos la consola no sirve ninguna página en producción:
      # es deliberado, para que un despliegue no quede abierto por olvido.
      #
      # SECRET firma las sesiones y debe fijarse siempre que haya cuentas de
      # usuario: si la firma se derivara de la contraseña compartida, cambiarla
      # cerraría todas las sesiones abiertas.
      BUHO_AUTH_SECRET: ${BUHO_AUTH_SECRET:-}
      # PASSWORD entra como administrador mientras no exista ninguna cuenta, para
      # poder crear la primera. En cuanto hay una, deja de funcionar.
      BUHO_AUTH_PASSWORD: ${BUHO_AUTH_PASSWORD:-}
      # Activar sólo si la consola termina TLS ella misma; detrás de un proxy
      # que lo termina, la cookie no debe exigir secure o nadie puede entrar.
      BUHO_AUTH_COOKIE_SECURE: ${BUHO_AUTH_COOKIE_SECURE:-false}
      TZ: ${BUHO_TZ:-UTC}
    ports:
      # Sigue escuchando en loopback: la autenticación no reemplaza al proxy o
      # la VPN, sólo deja de ser el único control.
      - "127.0.0.1:${BUHO_WEB_PORT:-3100}:3000"
    restart: unless-stopped

  # Traces ingest (in-house stack): apps → OTLP → Buho web JSON.
  # Separate from `collector` (DB metrics). Default URL hits host :3100 so
  # `npm run web` and docker-published web both work; override for all-in-docker:
  #   BUHO_OTLP_TRACES=http://web:3000/api/otlp/v1/traces
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: buho-otel-collector
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Default loopback. For remote eBPF/SSH agents set BUHO_OTLP_BIND=0.0.0.0
      - '${BUHO_OTLP_BIND:-127.0.0.1}:4317:4317' # OTLP gRPC
      - '${BUHO_OTLP_BIND:-127.0.0.1}:4318:4318' # OTLP HTTP
    environment:
      BUHO_OTLP_TRACES: ${BUHO_OTLP_TRACES:-http://host.docker.internal:3100/api/otlp/v1/traces}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  # El único dato que no se reconstruye es la historia del store — incluidas las
  # bases añadidas desde la consola (buho.monitor_targets). Nunca uses
  # `docker compose down -v` en un piloto: eso borra el volumen buho_store.
  backup:
    image: postgres:18-alpine
    depends_on:
      store:
        condition: service_healthy
    environment:
      BUHO_STORE_URL: postgres://buho:${BUHO_STORE_PASSWORD:-buho}@store:5432/buho
      BUHO_BACKUP_EVERY: ${BUHO_BACKUP_EVERY:-86400}
      BUHO_BACKUP_KEEP: ${BUHO_BACKUP_KEEP:-7}
      TZ: ${BUHO_TZ:-UTC}
    volumes:
      - ./scripts/backup-store.sh:/backup-store.sh:ro
      # Ruta del host a propósito: un respaldo dentro de un volumen de docker se
      # borra con el mismo `down -v` que borra lo que se quería respaldar.
      - ${BUHO_BACKUP_DIR:-./respaldos}:/respaldos
    entrypoint: ["/bin/sh", "/backup-store.sh"]
    restart: unless-stopped

volumes:
  buho_store:
